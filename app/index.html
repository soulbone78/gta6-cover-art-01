<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Vice — Classic Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="workspace">
  <aside class="sidebar" aria-label="Cover controls">
    <h1>Neon Vice</h1>
    <p class="blurb">Six photos, one poster — build a Vice City cover in a minute.</p>

    <section class="block">
      <h2>Poster grid</h2>
      <div class="options" id="layoutPicker" role="group" aria-label="Poster grid">
        <button type="button" data-layout="classic" class="on">Classic 6-panel</button>
        <button type="button" data-layout="grid">Grid 3 &times; 2</button>
        <button type="button" data-layout="hero">Hero + strip</button>
      </div>
    </section>

    <section class="block">
      <h2>Colour grade</h2>
      <div class="options" id="gradePicker" role="group" aria-label="Colour grade">
        <button type="button" data-grade="vice" class="on">Vice</button>
        <button type="button" data-grade="neon">Neon</button>
        <button type="button" data-grade="dusk">Dusk</button>
      </div>
    </section>

    <section class="block">
      <h2>Export size</h2>
      <div class="options" id="sizePicker" role="group" aria-label="Export size">
        <button type="button" data-size="square">1080 &times; 1080</button>
        <button type="button" data-size="portrait" class="on">1080 &times; 1350</button>
        <button type="button" data-size="wide">1920 &times; 1080</button>
      </div>
    </section>

    <section class="block">
      <h2>Caption</h2>
      <label class="line">Headline
        <input id="headline" type="text" maxlength="28" value="Vice City">
      </label>
      <label class="line">Tagline
        <input id="tagline" type="text" maxlength="48" value="Every sunset has a price.">
      </label>
    </section>

    <section class="block">
      <h2>Photos — pick a slot, then load a photo</h2>
      <div class="chips" id="slotChips"></div>
      <div class="actions">
        <button id="loadBtn" type="button">Load photo into this slot</button>
        <input id="filePicker" type="file" accept="image/*" hidden>
      </div>
      <div class="actions">
        <button id="repeatBtn" type="button">Use in every slot</button>
        <button id="samplesBtn" type="button">Fill with samples</button>
      </div>
      <label class="line">Zoom
        <input id="zoomSlider" type="range" min="1" max="2.5" step="0.01" value="1">
      </label>
      <div class="actions">
        <label class="line wide">Pan left / right
          <input id="panXSlider" type="range" min="-0.5" max="0.5" step="0.01" value="0">
        </label>
        <label class="line wide">Pan up / down
          <input id="panYSlider" type="range" min="-0.5" max="0.5" step="0.01" value="0">
        </label>
      </div>
      <p class="tip">Or drag a photo inside the preview to move it, and scroll over it to zoom.</p>
    </section>

    <button id="exportBtn" type="button" class="cta">Export PNG</button>
    <p id="notice" role="status"></p>
  </aside>

  <section class="stage" aria-label="Cover preview">
    <canvas id="poster" width="1080" height="1350" aria-label="The cover"></canvas>
    <p class="stage-note">Live preview — click a slot to pick it.</p>
  </section>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
